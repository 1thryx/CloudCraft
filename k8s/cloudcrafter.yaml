apiVersion: v1
kind: Namespace
name: cloudcrafter
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudcrafter-config
  namespace: cloudcrafter
data:
  JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
  ENV: "production"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudcrafter-user
  namespace: cloudcrafter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudcrafter-events
  namespace: cloudcrafter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudcrafter-tickets
  namespace: cloudcrafter
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudcrafter-notifications
  namespace: cloudcrafter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: cloudcrafter
  labels:
    app: users
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
    tier: api
  template:
    metadata:
      labels:
        app: users
        tier: api
    spec:
      serviceAccountName: cloudcrafter-user
      containers:
      - name: users
        image: cloudcrafter/users:latest
        ports:
        - containerPort: 5000
        env:
        - name: JWT_SECRET_KEY
          valueFrom:
            configMapKeyRef:
              name: cloudcrafter-config
              key: JWT_SECRET_KEY
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: cloudcrafter-config
              key: ENV
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/users/me
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/users/me
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: cloudcrafter
  labels:
    app: users
    tier: api
spec:
  selector:
    app: users
    tier: api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: cloudcrafter
  labels:
    app: events
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: events
    tier: api
  template:
    metadata:
      labels:
        app: events
        tier: api
    spec:
      serviceAccountName: cloudcrafter-events
      containers:
      - name: events
        image: cloudcrafter/events:latest
        ports:
        - containerPort: 5001
        env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: cloudcrafter-config
              key: ENV
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/events
            port: 5001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/events
            port: 5001
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: cloudcrafter
  labels:
    app: events
    tier: api
spec:
  selector:
    app: events
    tier: api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tickets-service
  namespace: cloudcrafter
  labels:
    app: tickets
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tickets
    tier: api
  template:
    metadata:
      labels:
        app: tickets
        tier: api
    spec:
      serviceAccountName: cloudcrafter-tickets
      containers:
      - name: tickets
        image: cloudcrafter/tickets:latest
        ports:
        - containerPort: 5002
        env:
        - name: S3_ENDPOINT_URL
          value: "http://localstack:4566"
        - name: S3_BUCKET
          value: "tickets"
        - name: NOTIFICATIONS_URL
          value: "http://notifications-service:5000"
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: cloudcrafter-config
              key: ENV
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/tickets
            port: 5002
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/tickets
            port: 5002
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tickets-service
  namespace: cloudcrafter
  labels:
    app: tickets
    tier: api
spec:
  selector:
    app: tickets
    tier: api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: cloudcrafter
  labels:
    app: notifications
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
    tier: api
  template:
    metadata:
      labels:
        app: notifications
        tier: api
    spec:
      serviceAccountName: cloudcrafter-notifications
      containers:
      - name: notifications
        image: cloudcrafter/notifications:latest
        ports:
        - containerPort: 5003
        env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: cloudcrafter-config
              key: ENV
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /api/notifications
            port: 5003
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/notifications
            port: 5003
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: cloudcrafter
  labels:
    app: notifications
    tier: api
spec:
  selector:
    app: notifications
    tier: api
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 5003
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudcrafter-ingress
  namespace: cloudcrafter
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: cloudcrafter.local
    http:
      paths:
      - path: /users
        pathType: Prefix
        backend:
          service:
            name: users-service
            port:
              number: 80
      - path: /events
        pathType: Prefix
        backend:
          service:
            name: events-service
            port:
              number: 80
      - path: /tickets
        pathType: Prefix
        backend:
          service:
            name: tickets-service
            port:
              number: 80
      - path: /notifications
        pathType: Prefix
        backend:
          service:
            name: notifications-service
            port:
              number: 80