version: '3.8'

services:
  users:
    build: ./services/users
    ports:
      - "5000:5000"
    environment:
      - USERS_PORT=5000
      - JWT_SECRET_KEY=supersecretkey

  events:
    build: ./services/events
    ports:
      - "5001:5001"
    environment:
      - EVENTS_PORT=5001

  tickets:
    build: ./services/tickets
    ports:
      - "5002:5002"
    environment:
      - TICKETS_PORT=5002
      - USERS_SERVICE_URL=http://users:5000
      - NOTIFICATIONS_SERVICE_URL=http://notifications:5003

  notifications:
    build: ./services/notifications
    ports:
      - "5003:5003"
    environment:
      - NOTIFICATIONS_PORT=5003
